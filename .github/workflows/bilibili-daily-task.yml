# BiliBili 每日任务
# 流程：刷新Cookie → 更新Secret → 执行每日任务
# 每天通过访问B站首页续命Cookie，模拟自然登录行为

name: bilibili-daily-task

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *" # UTC 16:00 = 北京时间 00:00

env:
  DOTNET_VERSION: "8.0.x"
  TZ: "Asia/Shanghai"

jobs:
  refresh-and-run:
    runs-on: ubuntu-latest

    steps:
      

      - name: Checkout
        uses: actions/checkout@v3

      # ========== Step 1: 刷新 Cookie ==========
      - name: Refresh Cookie
        id: refresh
        run: |
          chmod +x ./scripts/refresh-cookie.sh
          # refresh-cookie.sh 只输出 Cookie 到 stdout，日志到 stderr
          NEW_COOKIE=$(./scripts/refresh-cookie.sh "${{ secrets.COOKIESTR }}")

          echo "::group::Cookie 比较"
          OLD_HASH=$(echo "${{ secrets.COOKIESTR }}" | md5sum | cut -d' ' -f1)
          NEW_HASH=$(echo "$NEW_COOKIE" | md5sum | cut -d' ' -f1)
          echo "::endgroup::"

          if [ "$OLD_HASH" != "$NEW_HASH" ]; then
            echo "Cookie 有更新，同步到 Secrets..."
            echo "$NEW_COOKIE" | gh secret set COOKIESTR --repo susulqx/BiliBiliToolPro
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cookie 无变化，无需更新"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

          # 保存 Cookie 到临时文件（避免 GITHUB_OUTPUT 多行问题）
          echo "$NEW_COOKIE" > /tmp/refreshed_cookie
        env:
          GH_TOKEN: ${{ secrets.PAT }}

      # ========== Step 2: 安装 .NET ==========
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ========== Step 3: 执行每日任务 ==========
      - name: Run Daily Tasks
        run: |
          COOKIE=$(cat /tmp/refreshed_cookie)
          export Ray_BiliBiliCookies__1="$COOKIE"
          cd ./src/Ray.BiliBiliTool.Console
          dotnet run --runTasks="Daily&Manga"
        env:
          Ray_Security__RandomSleepMaxMin: 0
          Ray_DailyTaskConfig__SaveCoinsWhenLv6: true
          Ray_DailyTaskConfig__SupportUpIds: " "
          Ray_Serilog__WriteTo__0__Args__restrictedToMinimumLevel: Information
          # Telegram 推送
          Ray_Serilog__WriteTo__3__Args__botToken: ${{ secrets.TG_BOT_TOKEN }}
          Ray_Serilog__WriteTo__3__Args__chatId: "7791144119"
